name: CodeQL

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions' ]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect CodeQL default setup
        id: default_setup
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            try {
              const result = await github.request('GET /repos/{owner}/{repo}/code-scanning/default-setup', {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const state = result?.data?.state ?? 'unknown';
              const enabled = state !== 'not-configured';
              core.info(`CodeQL default setup state: ${state}`);
              core.setOutput('enabled', enabled ? 'true' : 'false');
            } catch (error) {
              core.info(`Could not read default setup state (${error.status ?? 'n/a'}). Assuming configured to avoid duplicate SARIF uploads.`);
              core.setOutput('enabled', 'true');
            }

      - name: Initialize CodeQL
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:${{ matrix.language }}

      - name: Skip duplicate CodeQL upload
        if: steps.default_setup.outputs.enabled == 'true'
        run: |
          echo "Repository CodeQL default setup is enabled; skipping advanced CodeQL workflow to avoid duplicate SARIF uploads."
