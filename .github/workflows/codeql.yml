name: CodeQL

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions' ]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect CodeQL default setup
        id: default_setup
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            try {
              const result = await github.request('GET /repos/{owner}/{repo}/code-scanning/default-setup', {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const state = result?.data?.state ?? 'unknown';
              const enabled = state !== 'not-configured';
              core.info(`CodeQL default setup state: ${state}`);
              core.setOutput('enabled', enabled ? 'true' : 'false');
            } catch (error) {
              core.info(`Could not read default setup state (${error.status ?? 'n/a'}). Assuming configured to avoid duplicate SARIF uploads.`);
              core.setOutput('enabled', 'true');
            }

      - name: Initialize CodeQL
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        if: steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: /language:${{ matrix.language }}

      - name: Skip duplicate CodeQL upload
        if: steps.default_setup.outputs.enabled == 'true'
        run: |
          echo "Repository CodeQL default setup is enabled; skipping advanced CodeQL workflow to avoid duplicate SARIF uploads."
