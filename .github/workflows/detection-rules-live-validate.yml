name: Detection Rules Live Validation

# Deliberately NOT triggered on pull_request: this job authenticates to a real
# Azure tenant via OIDC and creates/deletes real (disabled) Sentinel analytics
# rules. Restricting to push-to-main and manual dispatch means a PR - including
# from a fork - can never cause this workflow to run with tenant credentials.
# See docs/CI_LIVE_VALIDATION.md for the full safety model and setup steps.
on:
  push:
    branches:
      - main
    paths:
      - 'detections/**'
      - 'scripts/Test-DetectionRulesLive.ps1'
      - '.github/workflows/detection-rules-live-validate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Only one live-validation run against the tenant at a time - two concurrent
  # runs would race on the same fixed test rule IDs.
  group: detection-rules-live-validate
  cancel-in-progress: false

jobs:
  live-validate:
    name: Live Validate Against Azure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this environment's protection rules in GitHub repo settings
    # (required reviewer recommended) - see docs/CI_LIVE_VALIDATION.md. The
    # federated credential's subject is also scoped to this environment name,
    # so a workflow run outside it cannot mint an Azure token even if someone
    # edits this trigger.
    environment: azure-live-validation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure login (OIDC)
        uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_LIVE_VALIDATE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_LIVE_VALIDATE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_LIVE_VALIDATE_SUBSCRIPTION_ID }}

      - name: Install powershell-yaml
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.7 -Force -ErrorAction Stop

      - name: Validate detection rules against live Sentinel workspace
        shell: pwsh
        run: |
          ./scripts/Test-DetectionRulesLive.ps1 `
            -SubscriptionId '${{ secrets.AZURE_LIVE_VALIDATE_SUBSCRIPTION_ID }}' `
            -ResourceGroupName '${{ secrets.AZURE_LIVE_VALIDATE_RESOURCE_GROUP }}' `
            -WorkspaceName '${{ secrets.AZURE_LIVE_VALIDATE_WORKSPACE_NAME }}'
